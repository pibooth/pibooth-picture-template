# This workflows will upload a Python Package to PyPI when a release is created
# Publishing uses PyPI trusted publishing (OIDC), no API token is needed:
# https://docs.pypi.org/trusted-publishers/

name: PyPI publish on tag created

on:
  release:
    types: [created]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Install pibooth
      run: |
        pip install pibooth

    - name: Build
      run: |
        python -m build --no-isolation
        twine check dist/*

    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish:

    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pibooth-picture-template
    permissions:
      id-token: write  # Mandatory for trusted publishing

    steps:
    - name: Download the distribution packages
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
